            httpGet:
              path: /actuator/health/liveness
              port: 8088
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

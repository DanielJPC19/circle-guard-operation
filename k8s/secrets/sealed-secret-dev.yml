# SEALED SECRET — Dev Environment
#
# Este archivo contiene un SealedSecret cifrado con la clave pública del cluster.
# Es SEGURO versionar en git. El controlador Sealed Secrets lo descifra en runtime.
#
# Para regenerar este archivo después de instalar kubeseal en el cluster:
#
#   kubectl create secret generic circleguard-secret \
#     --namespace=circleguard-dev \
#     --from-literal=POSTGRES_PASSWORD=<real_pass> \
#     --from-literal=NEO4J_PASSWORD=<real_pass> \
#     --from-literal=JWT_SECRET=<real_secret_min_32_chars> \
#     --from-literal=QR_SECRET=<real_qr_secret> \
#     --from-literal=VAULT_SECRET=<real_vault_secret> \
#     --from-literal=VAULT_SALT=<real_salt> \
#     --from-literal=VAULT_HASH_SALT=<real_hash_salt> \
#     --from-literal=LDAP_MANAGER_PASSWORD=<real_ldap_pass> \
#     --dry-run=client -o yaml | \
#   kubeseal \
#     --controller-name=sealed-secrets \
#     --controller-namespace=kube-system \
#     --format yaml > k8s/secrets/sealed-secret-dev.yml
#
# NUNCA pongas el Secret sin cifrar en este archivo.
# NUNCA uses valores en base64 plano — usa siempre kubeseal.

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: circleguard-secret
  namespace: circleguard-dev
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
spec:
  encryptedData:
    # Reemplazar con valores cifrados reales via kubeseal
    POSTGRES_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    NEO4J_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    JWT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
    QR_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
    VAULT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
    VAULT_SALT: REPLACE_WITH_KUBESEAL_OUTPUT
    VAULT_HASH_SALT: REPLACE_WITH_KUBESEAL_OUTPUT
    LDAP_MANAGER_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: circleguard-secret
      namespace: circleguard-dev
    type: Opaque

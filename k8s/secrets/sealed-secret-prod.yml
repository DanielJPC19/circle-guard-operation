# SEALED SECRET — Production Environment
#
# Para regenerar:
#   kubectl create secret generic circleguard-secret \
#     --namespace=circleguard-prod \
#     --from-literal=POSTGRES_PASSWORD=<real_prod_pass> \
#     --from-literal=NEO4J_PASSWORD=<real_prod_pass> \
#     --from-literal=JWT_SECRET=<real_prod_secret_min_64_chars> \
#     --from-literal=QR_SECRET=<real_prod_qr_secret> \
#     --from-literal=VAULT_SECRET=<real_prod_vault_secret> \
#     --from-literal=VAULT_SALT=<real_prod_salt> \
#     --from-literal=VAULT_HASH_SALT=<real_prod_hash_salt> \
#     --from-literal=LDAP_MANAGER_PASSWORD=<real_prod_ldap_pass> \
#     --dry-run=client -o yaml | \
#   kubeseal --controller-name=sealed-secrets \
#            --controller-namespace=kube-system \
#            --format yaml > k8s/secrets/sealed-secret-prod.yml

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: circleguard-secret
  namespace: circleguard-prod
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
spec:
  encryptedData:
    POSTGRES_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    NEO4J_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
    JWT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
    QR_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
    VAULT_SECRET: REPLACE_WITH_KUBESEAL_OUTPUT
    VAULT_SALT: REPLACE_WITH_KUBESEAL_OUTPUT
    VAULT_HASH_SALT: REPLACE_WITH_KUBESEAL_OUTPUT
    LDAP_MANAGER_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: circleguard-secret
      namespace: circleguard-prod
    type: Opaque

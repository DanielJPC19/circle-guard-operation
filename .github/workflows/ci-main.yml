name: CI — Main (Production)

on:
  push:
    branches: [main]

env:
  ACR_REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  SERVICES: "auth-service identity-service promotion-service gateway-service notification-service form-service"

jobs:
  build-and-test:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: ./gradlew build -x test --parallel

      - name: Unit + Integration tests
        run: ./gradlew test integrationTest jacocoTestReport --parallel

      - name: SonarQube + Quality Gate
        run: |
          ./gradlew sonarqube \
            -Dsonar.projectKey=circleguard \
            -Dsonar.host.url=${{ secrets.SONARQUBE_URL }} \
            -Dsonar.login=${{ secrets.SONARQUBE_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push prod images
        id: build
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "image_tag=prod-${SHORT_SHA}" >> $GITHUB_OUTPUT
          for SERVICE in $SERVICES; do
            JAR=$(find services/circleguard-${SERVICE}/build/libs -name "*.jar" ! -name "*-plain.jar" | head -1)
            IMAGE="${ACR_REGISTRY}/circleguard/circleguard-${SERVICE}"
            docker build -f services/circleguard-${SERVICE}/Dockerfile \
              --build-arg JAR_FILE=${JAR} \
              --label "git.sha=${GITHUB_SHA}" \
              -t "${IMAGE}:prod-${SHORT_SHA}" \
              -t "${IMAGE}:latest" .
            docker push "${IMAGE}:prod-${SHORT_SHA}"
            docker push "${IMAGE}:latest"
          done

      - name: Trivy scan (all services)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_REGISTRY }}/circleguard/circleguard-gateway-service:${{ steps.build.outputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: '${{ secrets.STAGING_HEALTH_URL }}'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: true
          artifact_name: zap-report

      - name: Locust Performance Tests
        run: |
          pip install locust
          locust -f tests/performance/locustfile.py \
            --host=${{ secrets.STAGING_HEALTH_URL }} \
            --users=50 --spawn-rate=5 --run-time=5m \
            --headless --csv=results/locust \
            --exit-code-on-error 1

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
            results/locust*.csv
            zap-report/

  deploy-production:
    name: Deploy to Production
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production  # Requires manual approval in GitHub Environments

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger Jenkins Production
        run: |
          curl -s -X POST "${{ secrets.JENKINS_PROD_URL }}/job/circleguard-prod/buildWithParameters" \
            --user "ci:${{ secrets.JENKINS_TOKEN }}" \
            --data-urlencode "IMAGE_TAG=${{ needs.build-and-test.outputs.image_tag }}"

      - name: Wait for Jenkins Production
        timeout-minutes: 30
        run: |
          until curl -sf \
            "${{ secrets.JENKINS_PROD_URL }}/job/circleguard-prod/lastBuild/api/json" \
            --user "ci:${{ secrets.JENKINS_TOKEN }}" | \
            python3 -c "import sys,json; b=json.load(sys.stdin); exit(0 if b['result']=='SUCCESS' else 1)"; do
            sleep 30
          done

      - name: Semantic versioning & Git tag
        run: |
          git config user.email "ci@circleguard.edu"
          git config user.name "CircleGuard CI"
          
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          COMMITS=$(git log ${LAST_TAG}..HEAD --oneline)
          IFS='.' read -r -a parts <<< "${LAST_TAG#v}"
          MAJOR=${parts[0]}; MINOR=${parts[1]}; PATCH=${parts[2]}
          
          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|feat!:"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -q "feat:"; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          git tag "${NEW_TAG}" -m "Release ${NEW_TAG}"
          git push origin "${NEW_TAG}"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          generate_release_notes: true
          files: |
            results/locust*.csv
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
